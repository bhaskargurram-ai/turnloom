name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[mcp,skills,search,acp,team]" ruff
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: turnloom doctor

  integrations:
    # Everything optional that the terminal side can use: LiteLLM, the Provio gate, token counting.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[full]"
      - run: python -m unittest discover -s tests -v
      - name: MCP reference servers answer
        run: |
          turnloom tools examples/mcp.json time get_current_time
          turnloom tools examples/mcp.json git git_status

  minimal:
    # The core must work with its single dependency and no extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: turnloom --version && turnloom doctor && turnloom personas

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/turnloom --version && /tmp/clean/bin/turnloom doctor
          /tmp/clean/bin/turnloom personas --search reviewer
          /tmp/clean/bin/python -c "from importlib.resources import files; a = files('turnloom'); assert all(a.joinpath(*part).is_file() for part in (('studio_assets', 'studio.js'), ('studio_assets', 'THIRD-PARTY.txt'), ('data', 'providers.json'), ('personas', 'catalog.json'), ('personas', 'LICENSE')))"

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[mcp,guard,team,tokens]"
      - run: npm ci
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - name: Committed bundle matches a fresh build
        run: git diff --exit-code -- turnloom/studio_assets
      - run: npx playwright install --with-deps chromium
        working-directory: studio
      - run: npm run test:browser
        working-directory: studio
        env:
          PYTHON: python

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t turnloom:ci .
      - run: docker run --rm turnloom:ci doctor
      - name: The agent user cannot write outside the mounted workspace
        run: docker run --rm --entrypoint sh turnloom:ci -c 'test "$(id -u)" = 1000 && ! touch /opt/turnloom/x 2>/dev/null'
