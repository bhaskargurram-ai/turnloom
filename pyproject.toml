[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turnloom"
version = "0.5.0"
description = "A coding agent with a visual workbench, recoverable context and per-task cost estimates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["keyring>=25,<27"]

[project.optional-dependencies]
studio = ["rollback-mcp==0.2.0", "verifydoc[mcp]==0.10.0", "mcp>=1.30,<2", "ripgrep==14.1.0"]
mcp = ["mcp>=1.30,<2"]
skills = ["PyYAML>=6,<7"]
team = ["langgraph>=1.2,<2"]
full = ["mcp>=1.30,<2", "PyYAML>=6,<7", "langgraph>=1.2,<2", "mcp-server-time==2026.10.10", "mcp-server-git==2026.10.10"]

[project.scripts]
turnloom = "turnloom.cli:main"
turnloom-eval = "turnloom.evaluate:main"
turnloom-compare = "turnloom.compare:main"

[tool.setuptools]
packages = ["turnloom"]

[tool.setuptools.package-data]
turnloom = ["personas/*.md", "personas/LICENSE", "data/providers.json", "data/LICENSE.models-dev", "studio_assets/*"]

[project.gui-scripts]
turnloom-studio = "turnloom.studio:main"
