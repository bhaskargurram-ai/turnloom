  <text x="1184" y="532" text-anchor="end" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="26" fill="#1f3fbf">pipx install turnloom</text>
  <text x="96" y="588" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="22" fill="#4d4a43">Terminal · desktop Studio · MCP · ACP · any OpenAI-compatible model · MIT</text>
