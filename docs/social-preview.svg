  <text x="472" y="226" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="132" font-weight="700" letter-spacing="-3" fill="#1c1b18">Turnloom</text>
  <text x="478" y="284" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="26.5" fill="#4d4a43">A coding agent whose context you can inspect</text>
  <path d="M96 372H1184" stroke="#1c1b18" stroke-width="2"/>
  <g font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1c1b18">
    <text x="96" y="432" font-size="30" font-weight="600">Folded tool output stays recoverable</text>
    <text x="96" y="482" font-size="30" font-weight="600">Every edit is a diff you approve and can undo</text>
    <text x="96" y="532" font-size="30" font-weight="600">Every model call is metered</text>
